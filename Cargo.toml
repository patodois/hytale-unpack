[package]
name = "hytale-unpack"
version = "0.1.0"
edition = "2021"
description = "Reader for Hytale's Assets.zip: blocky models, animations and prefabs, with a rewrite-bridge provider"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Assets.zip stores every entry uncompressed, but the crate reads the central directory once and
# then seeks to single entries, which is all we need (the archive is 3.5 GB: never read it whole)
zip = { version = "8", default-features = false, features = ["deflate"] }
# The bridge to other game rewrites (see src/bridge.rs, github.com/patodois/rewrite-bridge)
rewrite-bridge = { git = "https://github.com/patodois/rewrite-bridge", rev = "1b5820180efbd585916ab206e6bcbbcf33096e1e", optional = true }

# The peak memory report of `check`
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["bridge"]
# `Provider` for Hytale, glTF export, and the CLI commands that use them
bridge = ["dep:rewrite-bridge"]

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
